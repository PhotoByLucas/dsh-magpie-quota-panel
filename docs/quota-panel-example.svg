<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">DSH Magpie Quota Panel — example</title>
  <desc id="desc">Example with synthetic data: separate 5-hour and 7-day Codex limits, WorkBuddy credits, and a daily window from another provider.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #18233b; }
    .eyebrow { font-size: 12px; letter-spacing: 1.6px; font-weight: 650; fill: #52637f; }
    .title { font-size: 22px; font-weight: 700; }
    .meta { font-size: 13px; fill: #52637f; }
    .account { font-size: 16px; font-weight: 700; }
    .label { font-size: 14px; }
    .value { font-size: 14px; font-weight: 650; }
    .track { fill: #e9eef5; }
  </style>
  <rect width="760" height="590" rx="24" fill="#f1f5fb"/>
  <text class="eyebrow" x="80" y="42">DEEPSEEK HARNESS / COMPOSER</text>
  <rect x="79" y="62" width="602" height="427" rx="16" fill="#e1e9f4" transform="translate(0 4)"/>
  <rect x="79" y="62" width="602" height="427" rx="16" fill="#fff" stroke="#cbd7e8"/>
  <text class="title" x="103" y="99">Magpie quota</text>
  <text class="meta" x="654" y="98" text-anchor="end">Updated at 09:41</text>
  <path d="M103 115H657 M103 290H657 M103 386H657" stroke="#e1e8f2"/>
  <text class="account" x="103" y="142">Codex</text>
  <text class="label" x="103" y="170">5 hours</text>
  <text class="value" x="657" y="170" text-anchor="end">42%</text>
  <rect class="track" x="103" y="180" width="554" height="5" rx="2.5"/>
  <rect x="103" y="180" width="233" height="5" rx="2.5" fill="#b36a13"/>
  <text class="meta" x="103" y="206">Resets today at 12:30</text>
  <text class="label" x="103" y="233">7 days</text>
  <text class="value" x="657" y="233" text-anchor="end">47%</text>
  <rect class="track" x="103" y="243" width="554" height="5" rx="2.5"/>
  <rect x="103" y="243" width="260" height="5" rx="2.5" fill="#b36a13"/>
  <text class="meta" x="103" y="269">Resets Monday at 09:00</text>
  <text class="account" x="103" y="320">WorkBuddy</text>
  <text class="label" x="103" y="348">Total credits</text>
  <text class="meta" x="595" y="348" text-anchor="end">796 / 800</text>
  <text class="value" x="657" y="348" text-anchor="end">99.5%</text>
  <rect class="track" x="103" y="359" width="554" height="5" rx="2.5"/>
  <rect x="103" y="359" width="551" height="5" rx="2.5" fill="#24834f"/>
  <text class="account" x="103" y="416">Example provider</text>
  <text class="label" x="103" y="443">Daily allowance</text>
  <text class="value" x="657" y="443" text-anchor="end">65%</text>
  <rect class="track" x="103" y="455" width="554" height="5" rx="2.5"/>
  <rect x="103" y="455" width="360" height="5" rx="2.5" fill="#24834f"/>
  <rect x="80" y="512" width="345" height="34" rx="10" fill="#dfe9f7" stroke="#cbd7e8"/>
  <text class="value" x="95" y="534">Codex 5h 42% · 7d 47% | WB 99.5% | +1</text>
  <text class="meta" x="680" y="569" text-anchor="end">Illustration · synthetic data</text>
</svg>
